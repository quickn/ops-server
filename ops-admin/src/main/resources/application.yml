server:
  port: 8989
nacos:
  config:
    server-addr: bs-nacos:8848
    context-path: /nacos
    encode: UTF-8
    #配置自动刷新
    refresh-enabled: true
    data-id: ${spring.application.name}.yaml
    type: yaml
    auto-refresh: true
    group: DEFAULT_GROUP
    #优先nacos配置
    remoteFirst: true
    #是否开启Nacos配置预加载
    bootstrap:
      enable: true
      log-enable: true
spring:
  devtools:
    restart:
      enabled: false
  ai:
    mcp:
      server:
        enabled: true
        name: ops-mcp
        version: 1.0.0
        # 【关键】设置为STREAMABLE启用Streamable-HTTP模式
        protocol: STREAMABLE
        streamable-http:
          # 可自定义MCP交互端点，默认是/mcp
          mcp-endpoint: /mcp
        annotation-scanner:
          enabled: true  # 启用注解扫描
        capabilities:
          tool: true     # 声明服务器提供工具能力
  main:
    #开启快速启动模式
    lazy-initialization: false
    allow-circular-references: true
    allow-bean-definition-overriding: true
  application:
    name: ops-server
  mvc:
    async:
      request-timeout: 20000
  jackson:
    ## 默认序列化时间格式
    date-format: yyyy-MM-dd HH:mm:ss
    ## 默认序列化时区
    time-zone: GMT+8
  profiles:
    active: dev
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://bs-mysql:3306/bs_monitor?characterEncoding=utf-8&characterSetResults=utf8&autoReconnect=true&useSSL=false&allowMultiQueries=true
    username: parking
    password: BSzn@1999@2022
    druid:
      query-timeout: 3000
      max-active: 1000
  data:
    redis:
      database: 9
      host: bs-redis
      port: 6379
      password: baisheng123
      timeout: 10s
      lettuce:
        pool:
          # 连接池最大连接数 默认8 ，负数表示没有限制
          max-active: 8
          # 连接池最大阻塞等待时间（使用负值表示没有限制） 默认-1
          max-wait: -1
          # 连接池中的最大空闲连接 默认8
          max-idle: 8
          # 连接池中的最小空闲连接 默认0
          min-idle: 0
  servlet:
    multipart:
      max-file-size: 1024MB  # 单个文件最大大小
      max-request-size: 1024MB  # 整个请求最大大小
      enabled: true
  rabbitmq:
    host: bs-rabbitmq
    port: 5672
    username: baisheng
    password: baisheng123
    virtual-host: bs_monitor
    listener:
      simple:
        acknowledge-mode: none
base:
  agentToken: monitorToken
mybatis-plus:
  global-config:
    db-config:
      # 主键ID类型
      id-type: none
      # 逻辑删除字段名称
      logic-delete-field: deleted
      # 逻辑删除-删除值
      logic-delete-value: 1
      # 逻辑删除-未删除值
      logic-not-delete-value: 0
  configuration:
    # 驼峰下划线转换
    map-underscore-to-camel-case: true
    # 这个配置会将执行的sql打印出来，在开发或测试的时候可以用
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    #log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
# 认证配置
auth:
  token:
    secret_key: SecretKey012345678901234567890123456789012345678901234567890123456789
    # token 有效期(单位:秒)
    ttl: 18000000

# springdoc配置： https://springdoc.org/properties.html
springdoc:
  swagger-ui:
    enabled: true
    operationsSorter: alpha
    tags-sorter: alpha
  api-docs:
    enabled: true

# 验证码配置
easy-captcha:
  # 验证码类型: arithmetic-算术
  type: arithmetic
  # 验证码有效时间(单位：秒)
  ttl: 120

# 系统配置
system:
  config:
    # 数据权限开关
    data-permission-enabled: true
    # 定时任务 xxl-job 开关
    xxl-job-enabled: true
    # WebSocket 开关
    websocket-enabled: true
upgradeClient:
  url: http://192.168.10.11:90/monitor/static/ops-agent-go
  version: 1.0.0
logging:
  #config: classpath:logback.xml
  config: config/logback.xml
  level:
    com.cloud: info
    com.alibaba.boot.nacos: info
security:
  ignore-paths:
    - "/receiver/**"
    - "/static/**"
    - "/agent/**"
    - "/api/v1/auth/captcha"
    - "/webjars/**"
    - "/doc.html"
    - "/swagger-resources/**"
    - "/v3/api-docs/**"
    - "/swagger-ui/**"
    - "/ws/**"
    - "/jar/download/**"
    - "/mcp/**"

docker:
  base:
    image: openjdk:8-jre-slim

rabbitmq:
  cmd:
    xMessageTTL: 60000
    concurrency: 8

oss:
  # OSS 类型 (目前支持aliyun、minio)
  type: minio
  # MinIO 对象存储服务
  minio:
    # 服务Endpoint
    endpoint: http://localhost:9000
    # 访问凭据
    access-key: minioadmin
    # 凭据密钥
    secret-key: minioadmin
    # 存储桶名称
    bucket-name: default
    # (可选)自定义域名，如果配置了域名，生成的文件URL是域名格式，未配置则URL则是IP格式 (eg: https://oss.youlai.tech)
    custom-domain:
  # 阿里云OSS对象存储服务
  aliyun:
    # 服务Endpoint
    endpoint: oss-cn-hangzhou.aliyuncs.com
    # 访问凭据
    access-key-id: your-access-key-id
    # 凭据密钥
    access-key-secret: your-access-key-secret
    # 存储桶名称
    bucket-name: default

decrypt:
  public-key: 
  password: your_secure_password

# 文件配置
file:
  upload:
    file-path: /logs/monitor
    jar-path: /docker
    work-path: /home/park
# xxl-job 定时任务配置
xxl:
  job:
    admin:
      # 多个地址使用,分割
      addresses: http://bs-job:9030/xxlJobAdmin
    accessToken:
    executor:
      appname: ${spring.application.name}
      address:
      ip:
      port: 39999
      logpath: /home/park/logs/xxl-job/jobhandler
      logretentiondays: 30

python:
  path: /usr/bin/python3
  script: /home/park/logs/py