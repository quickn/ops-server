server:
  port: 8989
  host: 192.168.10.11
nacos:
  config:
    server-addr: bs-nacos:8848
    encode: UTF-8
    #配置自动刷新
    refresh-enabled: true
    data-id: ${spring.application.name}.yaml
    type: yaml
    auto-refresh: true
    group: DEFAULT_GROUP
    #优先nacos配置
    remoteFirst: true
    #是否开启Nacos配置预加载
    bootstrap:
      enable: true
      log-enable: true
spring:
  main:
    #开启快速启动模式
    lazy-initialization: true
    allow-circular-references: true
  application:
    name: bs-monitor
  mvc:
    async:
      request-timeout: 20000
  jackson:
    ## 默认序列化时间格式
    date-format: yyyy-MM-dd HH:mm:ss
    ## 默认序列化时区
    time-zone: GMT+8
  profiles:
    active: dev
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://bs-mysql:3306/bs_monitor?characterEncoding=utf-8&characterSetResults=utf8&autoReconnect=true&useSSL=false&allowMultiQueries=true
    username: parking
    password: BSzn@1999@2022
    druid:
      query-timeout: 3000
      max-active: 1000
  data:
    redis:
      database: 8
      host: bs-redis
      port: 6379
      password: open_cloud_test_1
      timeout: 10s
      lettuce:
        pool:
          # 连接池最大连接数 默认8 ，负数表示没有限制
          max-active: 8
          # 连接池最大阻塞等待时间（使用负值表示没有限制） 默认-1
          max-wait: -1
          # 连接池中的最大空闲连接 默认8
          max-idle: 8
          # 连接池中的最小空闲连接 默认0
          min-idle: 0
  servlet:
    multipart:
      max-file-size: 1024MB  # 单个文件最大大小
      max-request-size: 1024MB  # 整个请求最大大小
      enabled: true
  rabbitmq:
    #开启confirmCallback 生产者 -> 队列 （可靠投递）
    publisher-confirm-type: correlated
    # 开启returnCallback 交换机到队列的保证机制
    publisher-returns: true
    template:
      #定义消息路由失败时的策略。true，则调用ReturnCallback
      mandatory: true
      retry:
        #重试间隔时间（单位毫秒）
        initial-interval: 3000
        max-attempts: 3
        enabled: true
        max-interval: 3s
        multiplier: 1.2
    listener:
      simple:
        # 最小线程数量
        concurrency: 8
        # 最大线程数量
        max-concurrency: 32
        #重试次数超过上面的设置之后是否丢弃
        default-requeue-rejected: true
        #消息接收确认
        acknowledge-mode: manual
        #每个消费者可能未完成的最大未确认消息数量
        #每个线程都会抓取10个消息到内存进行消费 可以增大消息的传递提升并发量
        #代表多少消息未被ack时，rabbitmq不会给消费者发送新的消息
        prefetch: 50
        #添加本地重试机制
        retry:
          #开启消费者出现异常情况下重试
          enabled: true
          #重试间隔时间（单位毫秒）
          initial-interval: 3000
          #乘子
          multiplier: 1
          #最大重试次数
          max-attempts: 5
          # true无状态；false有状态
          stateless: true
    host: bs-rabbitmq
    port: 5672
    username: baisheng
    password: baisheng123
    virtual-host: bs_monitor
    publisher-confirms: true
base:
  #服务接口监控间隔，单位毫秒，默认10分钟
  heathTimes: 120000
mybatis-plus:
  global-config:
    db-config:
      # 主键ID类型
      id-type: none
      # 逻辑删除字段名称
      logic-delete-field: deleted
      # 逻辑删除-删除值
      logic-delete-value: 1
      # 逻辑删除-未删除值
      logic-not-delete-value: 0
  configuration:
    # 驼峰下划线转换
    map-underscore-to-camel-case: true
    # 这个配置会将执行的sql打印出来，在开发或测试的时候可以用
    #log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
# 认证配置
auth:
  token:
    secret_key: SecretKey012345678901234567890123456789012345678901234567890123456789
    # token 有效期(单位:秒)
    ttl: 18000000

# springdoc配置： https://springdoc.org/properties.html
springdoc:
  swagger-ui:
    enabled: true
    operationsSorter: alpha
    tags-sorter: alpha
  api-docs:
    enabled: true

# 验证码配置
easy-captcha:
  # 验证码类型: arithmetic-算术
  type: arithmetic
  # 验证码有效时间(单位：秒)
  ttl: 120

# 系统配置
system:
  config:
    # 数据权限开关
    data-permission-enabled: true
    # 定时任务 xxl-job 开关
    xxl-job-enabled: false
    # WebSocket 开关
    websocket-enabled: true
upgradeClient:
  url: http://local.bisenpark.com:1082/client/bs-agent-release.jar
  version: 1.0.0
logging:
  config: classpath:logback-nacos.xml
  level:
    com.bszn: info
    com.alibaba.boot.nacos: info
security:
  ignore-paths:
    - "/agent/**"
    - "/api/v1/auth/captcha"
    - "/webjars/**"
    - "/doc.html"
    - "/swagger-resources/**"
    - "/v3/api-docs/**"
    - "/swagger-ui/**"
    - "/ws/**"

# JAR包上传配置
jar:
  upload:
    # linux
    path: /home/jars  # JAR包存储路径
    # windows
#    path: C:\e\jars  # JAR包存储路径


docker:
  base:
    image: openjdk:8-jre-slim

rabbitmq:
  cmd:
    xMessageTTL: 60000
    concurrency: 8