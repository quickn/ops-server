server:
  port: 8989
nacos:
  config:
    server-addr: bs-nacos:8848
    encode: UTF-8
    #配置自动刷新
    refresh-enabled: true
    data-id: ${spring.application.name}.yaml
    type: yaml
    auto-refresh: true
    group: DEFAULT_GROUP
    #优先nacos配置
    remoteFirst: true
    #是否开启Nacos配置预加载
    bootstrap:
      enable: true
      log-enable: true
spring:
  main:
    #开启快速启动模式
    lazy-initialization: true
  application:
    name: bs-monitor
  mvc:
    async:
      request-timeout: 20000
  jackson:
    ## 默认序列化时间格式
    date-format: yyyy-MM-dd HH:mm:ss
    ## 默认序列化时区
    time-zone: GMT+8
  profiles:
    active: dev
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://bs-mysql:3306/bs_monitor?characterEncoding=utf-8&characterSetResults=utf8&autoReconnect=true&useSSL=false&allowMultiQueries=true
    username: parking
    password: BSzn@1999@2022
    druid:
      query-timeout: 3000
      max-active: 1000
  data:
    redis:
      database: 8
      host: bs-redis
      port: 6379
      password: open_cloud_test_1
      timeout: 10s
      lettuce:
        pool:
          # 连接池最大连接数 默认8 ，负数表示没有限制
          max-active: 8
          # 连接池最大阻塞等待时间（使用负值表示没有限制） 默认-1
          max-wait: -1
          # 连接池中的最大空闲连接 默认8
          max-idle: 8
          # 连接池中的最小空闲连接 默认0
          min-idle: 0
  servlet:
    multipart:
      max-file-size: 1024MB  # 单个文件最大大小
      max-request-size: 1024MB  # 整个请求最大大小
      enabled: true
base:
  #服务接口监控间隔，单位毫秒，默认10分钟
  heathTimes: 120000
mybatis-plus:
  global-config:
    db-config:
      # 主键ID类型
      id-type: none
      # 逻辑删除字段名称
      logic-delete-field: deleted
      # 逻辑删除-删除值
      logic-delete-value: 1
      # 逻辑删除-未删除值
      logic-not-delete-value: 0
  configuration:
    # 驼峰下划线转换
    map-underscore-to-camel-case: true
    # 这个配置会将执行的sql打印出来，在开发或测试的时候可以用
    #log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
# 认证配置
auth:
  token:
    secret_key: SecretKey012345678901234567890123456789012345678901234567890123456789
    # token 有效期(单位:秒)
    ttl: 18000000

# springdoc配置： https://springdoc.org/properties.html
springdoc:
  swagger-ui:
    enabled: true
    operationsSorter: alpha
    tags-sorter: alpha
  api-docs:
    enabled: true

# 验证码配置
easy-captcha:
  # 验证码类型: arithmetic-算术
  type: arithmetic
  # 验证码有效时间(单位：秒)
  ttl: 120

# 系统配置
system:
  config:
    # 数据权限开关
    data-permission-enabled: true
    # 定时任务 xxl-job 开关
    xxl-job-enabled: false
    # WebSocket 开关
    websocket-enabled: true
upgradeClient:
  url: http://local.bisenpark.com:1082/client/bs-agent-release.jar
  version: 1.0.0
logging:
  config: classpath:logback-nacos.xml
  level:
    com.bszn: info
    com.alibaba.boot.nacos: info
security:
  ignore-paths:
    - "/agent/**"
    - "/api/v1/auth/captcha"
    - "/webjars/**"
    - "/doc.html"
    - "/swagger-resources/**"
    - "/v3/api-docs/**"
    - "/swagger-ui/**"
    - "/ws/**"

# JAR包上传配置
jar:
  upload:
    # linux
#    path: /home/jars  # JAR包存储路径
    # windows
    path: C:\e\jars  # JAR包存储路径